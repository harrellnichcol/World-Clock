<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <title>World Clock - Nichcol Harrell</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Select a city..</option>
        <option value="">Paris💙</option>
        <option value="">Rome💛</option>
        <option value="">New York ❤️</option>
      </select>

      <div class="city">
        <div>
          <h2>
            Los Angeles
            <img src="images/us.svg" alt="United States flag" class="flag" />
          </h2>
          <div class="date">July 30th 2026</div>
        </div>

        <div class="time">10:16:45 <small>AM</small></div>
      </div>
      <div class="city">
        <div>
          <h2>
            London
            <img src="images/gb.svg" alt="United Kingdom flag" class="flag" />
          </h2>
          <div class="date">July 30th 2026</div>
        </div>

        <div class="time">6:16:45 <small>PM</small></div>
      </div>
      <div class="city">
        <div>
          <h2>
            Paris
            <img src="images/fr.svg" alt="France flag" class="flag" />
          </h2>
          <div class="date">July 30th 2026</div>
        </div>

        <div class="time">7:16:45 <small>PM</small></div>
      </div>
      <div class="city">
        <div>
          <h2>
            Rome
            <img src="images/it.svg" alt="Italy flag" class="flag" />
          </h2>
          <div class="date">July 30th 2026</div>
        </div>

        <div class="time">7:16:45 <small>PM</small></div>
      </div>
    </div>
    <footer>
      This project was coded by <strong>Nichcol Harrell</strong> with 💙and is
      <a href="https://github.com/harrellnichcol/World-Clock" target="_blank">
        open sourced on GitHub</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
