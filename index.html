<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <title>World Clock - Nichcol Harrell</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Select a city..</option>
        <option value="">Paris💙</option>
        <option value="">Rome💛</option>
        <option value="">New York ❤️</option>
      </select>

      <div class="city">
        <h2>
          Los Angeles
          <img src="images/us.svg" alt="United States flag" class="flag" />
        </h2>
        <div class="date">July 29th 2026</div>
        <div class="time">9:07:45 PM</div>
      </div>
      <div class="city">
        <h2>
          London
          <img src="images/gb.svg" alt="United Kingdom flag" class="flag" />
        </h2>
        <div class="date">July 30th 2026</div>
        <div class="time">4:07:45 AM</div>
      </div>
      <div class="city">
        <h2>
          Paris <img src="images/fr.svg" alt="France flag" class="flag" />
        </h2>
        <div class="date">July 30th 2026</div>
        <div class="time">5:07:45 AM</div>
      </div>
      <div class="city">
        <h2>Rome <img src="images/it.svg" alt="Italy flag" class="flag" /></h2>
        <div class="date">July 30th 2026</div>
        <div class="time">5:07:45 AM</div>
      </div>
    </div>
    <footer>
      This project was coded by Nichcol Harrell with 💙and is
      <a href="https://github.com/harrellnichcol/World-Clock" target="_blank">
        open sourced on GitHub</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
